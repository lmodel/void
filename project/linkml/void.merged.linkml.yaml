  "description": "A LinkML rendering of the Vocabulary of Interlinked Datasets (VoID), the RDF vocabulary for describing datasets of linked data and the links between them, as the W3C Interest Group Note of 3 March 2011 explains it. Every VoID class and property keeps its VoID IRI, and the Dublin Core, FOAF and RDF Schema terms the Note uses in a description keep theirs.",
  "title": "Vocabulary of Interlinked Datasets (VoID)",
  "comments": [
    "The version is the date of the Note's edition, and the source its dated address. The schema renders every class and property that the vocabulary file declares, as its editors keep it at the commit the vocabulary_file annotation names; tests/upstream/void-terms.tsv lists them, and the tests hold this schema to that list.",
    "Neither the Note nor the vocabulary file is copied: every description here is this project's own, and NOTICE says why.",
    "A slot whose value names a resource by its IRI or a CURIE, such as id, class, subset or target, carries the pattern of a scheme or prefix, a colon and no space. LinkML 1.12.1 renders the uriorcurie type, and a reference to a class, as a JSON Schema string with no format, so without it the validator would pass any text there.",
    "Each class and slot names, in its note_section annotation, the section of the Note that explains it. The class names are VoID's own, with no prefix of this schema's: no record carries a class name, and the adapt copy renames Dataset, which LOKF also defines, to VoidDataset.",
    "Kept from the Note's account of a description: the Dublin Core terms of its sections 2.2, 2.4 and 2.5, FOAF's homepage and page (2.1) and topic and primaryTopic (6.2), and the RDF Schema label, comment and seeAlso of a technical feature (2.6). Left out: dcterms:date, since a slot named date takes the name of LinkML's date type, and the generated Pydantic model then checks none of the dates, while created, issued and modified carry the dates the Note names; the agents a description names, which FOAF describes; the Waiver vocabulary's norms and waiver (2.4); and the SPARQL Service Description terms (6.5), which describe a service rather than a dataset."
  ],
  "source": "https://www.w3.org/TR/2011/NOTE-void-20110303/",
  "see_also": [
    "https://lmodel.github.io/void",
    "https://www.w3.org/TR/void/"
  ],
